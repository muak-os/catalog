# Verify catalog data (drift detector)

name: Verify catalog

on:
  push:
    branches: [master]
    paths:
      - "core/**"
      - "overlays/**"
      - "extensions/**"
  pull_request:
    paths:
      - "core/**"
      - "overlays/**"
      - "extensions/**"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify pinned entries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every pinned entry
        env:
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just verify
