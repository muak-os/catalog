# Verify catalog data (drift detector)

name: Verify catalog

on:
  push:
    branches: [master]
    paths:
      - "core/**"
      - "overlays/**"
      - "extensions/**"
  pull_request:
    paths:
      - "core/**"
      - "overlays/**"
      - "extensions/**"
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Verify pinned entries
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify every pinned entry
        env:
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just verify
