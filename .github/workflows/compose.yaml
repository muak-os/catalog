# Compose a release line
#
# Requires an APP_ID / APP_PRIVATE_KEY repo secrets.

name: Compose release line

on:
  workflow_dispatch:
    inputs:
      from_line:
        description: "Lineage parent line (default: newest line)"
        required: false
        type: string
      open_pr:
        description: "Open or update a catalog PR"
        required: false
        type: boolean
        default: true

  workflow_call:
    inputs:
      release:
        description: "Release line to compose; empty discovers the latest stable tag"
        required: false
        type: string
        default: ""
      installer:
        description: "Optional installer tag; empty uses the release tag"
        required: false
        type: string
        default: ""
      from_line:
        description: "Optional lineage parent line"
        required: false
        type: string
        default: ""
      force:
        description: "Replace an already-published line"
        required: false
        type: boolean
        default: false
      auto:
        description: "Bump unselected entries to their newest version tag"
        required: false
        type: boolean
        default: true
      open_pr:
        description: "Open or update a catalog PR"
        required: false
        type: boolean
        default: true
      artifact:
        description: "Optional artifact name for the composed documents"
        required: false
        type: string
        default: ""
      toolchain:
        description: "Optional toolchain image reference"
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

concurrency:
  group: compose
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  BASE_BRANCH: master
  MUAK_REPO: muak-os/muak
  TOOLCHAIN_IMAGE: muak-os/toolchain
  CONTAINER_RUNTIME: docker

jobs:
  compose:
    name: Compose
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        id: bot
        if: inputs.open_pr
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: muak-os
          repositories: catalog

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: muak-os/catalog
          token: ${{ steps.bot.outputs.token || github.token }}
          fetch-depth: 0

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - name: Resolve release and toolchain
        env:
          RELEASE_INPUT: ${{ inputs.release }}
          TOOLCHAIN_INPUT: ${{ inputs.toolchain }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release="$RELEASE_INPUT"
          if [ -z "$release" ]; then
            release="$(gh api "repos/${MUAK_REPO}/tags" --paginate --jq '.[].name' \
              | awk '/^v[0-9]+\.[0-9]+\.[0-9]+/' | sort -V | tail -1)"
            if [ -z "$release" ]; then
              echo "::error::No v-semver tag found on ${MUAK_REPO}"
              exit 1
            fi
          fi

          toolchain="$TOOLCHAIN_INPUT"
          if [ -z "$toolchain" ]; then
            digest="$(just digest "ghcr.io/${TOOLCHAIN_IMAGE}" "$release")"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::No manifest digest found for ${TOOLCHAIN_IMAGE}:${release}. Was the release pushed?"
              exit 1
            fi
            toolchain="ghcr.io/muak-os/toolchain@${digest}"
            sed -i -E "s|ghcr\.io/muak-os/toolchain@sha256:[0-9a-f]+|${toolchain}|" Justfile
          fi

          printf 'RELEASE=%s\nTOOLCHAIN=%s\n' "$release" "$toolchain" >> "$GITHUB_ENV"
          printf 'Composing release line %s with %s\n' "$release" "$toolchain"

      - name: Compose the release line
        env:
          FROM_LINE: ${{ inputs.from_line }}
          INSTALLER: ${{ inputs.installer }}
          AUTO: ${{ inputs.auto }}
          FORCE: ${{ inputs.force }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          args=(--release "$RELEASE")
          if [ "${AUTO:-true}" = "true" ]; then
            args+=(--auto)
          fi
          if [ -n "$INSTALLER" ]; then
            args+=(--set "installer=muak-os/muak@installer@$INSTALLER")
          else
            args+=(--set "installer=$RELEASE")
          fi
          if [ -n "$FROM_LINE" ]; then
            args+=(--from-line "$FROM_LINE")
          fi
          if [ "$FORCE" = "true" ]; then
            args+=(--force)
          fi

          just compose "${args[@]}"

      - name: Upload composed catalog
        if: inputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.artifact }}
          path: |
            core/${{ inputs.release }}.toml
            overlays/${{ inputs.release }}.toml
            extensions/${{ inputs.release }}.toml
          if-no-files-found: error
          overwrite: true

      - name: Open or update release PR
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          branch="catalog/${RELEASE}"
          git config user.name "Muak Bot[bot]"
          git config user.email "muak-bot[bot]@users.noreply.github.com"
          git checkout -B "${branch}"

          git add Justfile core overlays extensions
          if git diff --cached --quiet; then
            echo "Line ${RELEASE} already matches the composed pins; nothing to commit."
            exit 0
          fi

          {
            printf '## Composed release line `%s`\n\n' "$RELEASE"
            printf '%s\n' \
              'Every carried entry was bumped and pinned by `kata compose`, resolved' \
              'and verified against the registry. Published pins never change and' \
              'published lines only grow — the diff above is the audit record.' \
              '' \
              'The `toolchain` image pin moved to the released digest.' \
              '' \
              'Merging publishes nothing by itself: run the **Publish catalog**' \
              "workflow for \`${RELEASE}\` afterwards." \
              '' \
              "Composed by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > pr-body.md

          git commit -m "chore(catalog): compose release line ${RELEASE}"
          git push --force origin "${branch}"

          if gh pr view "${branch}" --state open > /dev/null 2>&1; then
            gh pr edit "${branch}" --title "catalog: compose ${RELEASE}" --body-file pr-body.md
          else
            gh pr create --base "$BASE_BRANCH" --head "${branch}" \
              --title "chore(catalog): compose ${RELEASE}" --body-file pr-body.md
          fi
