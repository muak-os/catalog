# Publish catalog images for a release line

name: Publish catalog

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release line to publish (e.g. v1.2.3)"
        required: true
        type: string
      channels:
        description: "Channel tags to move to this line (e.g. stable or stable,beta)"
        required: false
        type: string

concurrency:
  group: publish-${{ inputs.release }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ inputs.release }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ inputs.release }}
        env:
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just publish "${{ inputs.release }}" "${{ inputs.channels }}"

      - name: Summary
        run: |
          echo "### Catalog images published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release:** \`${{ inputs.release }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Images:** \`core:${{ inputs.release }}\`, \`overlays:${{ inputs.release }}\`, \`extensions:${{ inputs.release }}\`" >> "$GITHUB_STEP_SUMMARY"
