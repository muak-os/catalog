# Publish catalog images for a release line

name: Publish catalog

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release line to publish (e.g. v1.2.3)"
        required: true
        type: string
      channels:
        description: "Channel tags to move to this line (e.g. stable or stable,beta)"
        required: false
        type: string
        default: ""
      artifact:
        description: "Optional composed catalog artifact name"
        required: false
        type: string
        default: ""
      toolchain:
        description: "Optional toolchain image reference"
        required: false
        type: string
        default: ""

  workflow_call:
    inputs:
      release:
        description: "Release line to publish"
        required: true
        type: string
      channels:
        description: "Channel tags to move to this line"
        required: false
        type: string
        default: ""
      artifact:
        description: "Optional composed catalog artifact name"
        required: false
        type: string
        default: ""
      toolchain:
        description: "Optional toolchain image reference"
        required: false
        type: string
        default: ""

concurrency:
  group: publish-${{ inputs.release }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ inputs.release }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CONTAINER_RUNTIME: docker
      REGISTRY: ghcr.io/muak-os
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: muak-os/catalog

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: just@1.58.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select toolchain
        if: inputs.toolchain != ''
        env:
          TOOLCHAIN_INPUT: ${{ inputs.toolchain }}
        run: |
          printf 'TOOLCHAIN=%s\n' "$TOOLCHAIN_INPUT" >> "$GITHUB_ENV"

      - name: Download composed catalog
        if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.artifact }}
          path: .

      - name: Publish ${{ inputs.release }}
        env:
          RELEASE: ${{ inputs.release }}
          CHANNELS: ${{ inputs.channels }}
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          just publish "$RELEASE" "$CHANNELS"

      - name: Summary
        env:
          RELEASE: ${{ inputs.release }}
          CHANNELS: ${{ inputs.channels }}
          ARTIFACT: ${{ inputs.artifact }}
        run: |
          {
            printf '### Catalog published\n'
            printf -- '- **Release:** `%s`\n' "$RELEASE"
            if [ -n "$ARTIFACT" ]; then
              printf -- '- **Artifact:** `%s`\n' "$ARTIFACT"
            fi
            if [ -n "$CHANNELS" ]; then
              printf -- '- **Channels:** `%s`\n' "$CHANNELS"
            fi
            printf -- '- **Images:** `core:%s`, `overlays:%s`, `extensions:%s`\n' \
              "$RELEASE" "$RELEASE" "$RELEASE"
          } >> "$GITHUB_STEP_SUMMARY"
