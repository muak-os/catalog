# Publish catalog images for a release line

name: Publish catalog

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release line to publish (e.g. v1.2.3)"
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.release }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ inputs.release }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@just

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ inputs.release }}
        env:
          KOCI_REGISTRY_USERNAME: ${{ github.actor }}
          KOCI_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: just publish "${{ inputs.release }}"

      - name: Summary
        run: |
          echo "### Catalog images published" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Release:** \`${{ inputs.release }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Images:** \`core:${{ inputs.release }}\`, \`overlays:${{ inputs.release }}\`, \`extensions:${{ inputs.release }}\`" >> "$GITHUB_STEP_SUMMARY"
